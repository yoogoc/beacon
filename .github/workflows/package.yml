name: package

# Main pushes publish development prereleases; vX.Y.Z tags publish formal
# releases. Manual runs produce artifacts only. All paths run the shared CI.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and prepare version
        id: release
        run: python scripts/release.py prepare

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  package:
    needs: [prepare, checks]
    name: ${{ matrix.name }}
    env:
      BEACON_UPDATE_PUBLIC_KEY: ${{ secrets.BEACON_UPDATE_PUBLIC_KEY }}
    runs-on: ${{ matrix.runner }}
    # Development builds tolerate unverified packaging targets. Formal
    # releases require every target; shared lint/build/tests must always pass.
    continue-on-error: ${{ needs.prepare.outputs.prerelease == 'true' && matrix.unproven }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built, mounted and launched on this machine. See docs/PACKAGING.md.
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            formats: app,dmg
            unproven: false

          # Cross-compiled on the same arm64 runner rather than asking for an
          # Intel one: the macOS SDK produces both, and the Intel runners are
          # on their way out.
          - name: macos-amd64
            runner: macos-15
            target: x86_64-apple-darwin
            formats: app,dmg
            unproven: false

          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            unproven: true

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            formats: deb,appimage
            unproven: true

          # nsis rather than wix: cargo-packager downloads NSIS itself, while
          # WiX wants a separate toolset installed first.
          - name: windows-amd64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            formats: nsis
            unproven: true

          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            formats: nsis
            unproven: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release.py set "$RELEASE_VERSION"

      - name: Validate updater signing configuration
        shell: bash
        env:
          RELEASE_PUBLISH: ${{ needs.prepare.outputs.publish }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.BEACON_UPDATE_PRIVATE_KEY }}
        run: |
          if [ "$RELEASE_PUBLISH" = "true" ] && { [ -z "$BEACON_UPDATE_PUBLIC_KEY" ] || [ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]; }; then
            echo "::error::Configure BEACON_UPDATE_PUBLIC_KEY and BEACON_UPDATE_PRIVATE_KEY before publishing signed updates."
            exit 1
          fi
          python3 - <<'PYKEY'
          import os
          from pathlib import Path
          configured = os.environ.get("BEACON_UPDATE_PUBLIC_KEY", "").strip()
          expected = Path("assets/packaging/update-public-key").read_text().strip()
          if configured and configured != expected:
              raise SystemExit("The GitHub public key must match the public key checked into packaging assets")
          PYKEY

      # rust-toolchain.toml pins the channel; this only adds the cross target.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Six jobs on one key would evict each other every run.
          key: ${{ matrix.name }}

      # The same list CI builds with -- X11, Wayland, Vulkan, fonts, ALSA.
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      # `cargo install` rather than a prebuilt-binary action: cargo-packager is
      # not in taiki-e/install-action's tool list, so that route would simply
      # fail. The cache above covers the rebuild after the first run.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # Build explicitly rather than through a packager hook. Hooks run under
      # `sh` on Unix and `cmd.exe` on Windows, so no single hook string can
      # expand `--target` on both.
      - name: Build
        run: cargo build --locked --release -p beacon --target ${{ matrix.target }}

      - name: Verify Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1 -Binary "target/${{ matrix.target }}/release/beacon.exe"

      - name: Verify Windows application icon
        if: runner.os == 'Windows'
        run: python scripts/check-windows-icon.py "target/${{ matrix.target }}/release/beacon.exe"

      - name: Package
        if: runner.os != 'Linux'
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.BEACON_UPDATE_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.BEACON_UPDATE_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]; then unset CARGO_PACKAGER_SIGN_PRIVATE_KEY CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD; fi
          cargo packager -p beacon --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.BEACON_UPDATE_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.BEACON_UPDATE_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy needs this on runners without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          if [ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]; then unset CARGO_PACKAGER_SIGN_PRIVATE_KEY CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD; fi
          python scripts/release.py deb-config --target "$PACKAGE_TARGET" --output target/release-deb.json
          DEB_CONFIG=$(cat target/release-deb.json)
          cargo packager --config "$DEB_CONFIG" --formats deb
          cargo packager -p beacon --release --target "$PACKAGE_TARGET" --formats appimage

      - name: Give signed macOS archives unique release names
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          UPDATE_FLAGS=()
          if [ "$RELEASE_PUBLISH" != "true" ]; then UPDATE_FLAGS+=(--unsigned); fi
          python scripts/updates.py stage-macos --directory "target/${{ matrix.target }}/release" --platform "${{ matrix.name }}" --version "$RELEASE_VERSION" "${UPDATE_FLAGS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.name }}
          # The version is applied to Cargo before building and packaging.
          path: |
            target/${{ matrix.target }}/release/*.dmg
            target/${{ matrix.target }}/release/*.deb
            target/${{ matrix.target }}/release/*.AppImage
            target/${{ matrix.target }}/release/*-setup.exe
            target/${{ matrix.target }}/release/*.msi
            target/${{ matrix.target }}/release/*.app.tar.gz
            target/${{ matrix.target }}/release/*.sig
          if-no-files-found: error

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, checks, package]
    runs-on: ubuntu-24.04
    # Reruns of the same release cannot upload concurrently. Distinct main
    # pushes keep their own builds rather than cancelling earlier versions.
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json 2> release-error.txt; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          if not json.loads(Path("release.json").read_text())["draft"]:
              raise SystemExit("This release is already published; use a new version.")
          PY
          elif ! grep -q '\(HTTP 404\)' release-error.txt; then
            cat release-error.txt
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
        with:
          key: update-manifest
      - name: Install cargo-packager signer
        run: cargo install cargo-packager --version 0.11.8 --locked

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build and sign update manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.BEACON_UPDATE_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.BEACON_UPDATE_PRIVATE_KEY_PASSWORD }}
          BEACON_UPDATE_PUBLIC_KEY: ${{ secrets.BEACON_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          UPDATE_FLAGS=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then UPDATE_FLAGS+=(--allow-missing); fi
          python scripts/updates.py manifest --artifacts artifacts --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --output artifacts/update.json "${UPDATE_FLAGS[@]}"
          cargo packager signer sign artifacts/update.json
          cargo run --locked -p beacon-updater --bin verify-update -- artifacts

      - name: Record build provenance and available packages
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          packages = sorted(path for path in Path("artifacts").rglob("*") if path.is_file())
          if not packages or any(not path.is_file() for path in packages):
              raise SystemExit("No release packages found, or unexpected artifact layout")
          if len({path.name for path in packages}) != len(packages):
              raise SystemExit("Release asset names must be unique across platforms")
          channel = "Development build (pre-release)" if os.environ["RELEASE_PRERELEASE"] == "true" else "Formal release"
          url = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          lines = [
              f'{channel}: **{os.environ["RELEASE_VERSION"]}**',
              f'Commit: `{os.environ["GITHUB_SHA"]}`',
              f'Checks and packaging: [workflow run]({url})',
              "", "Available packages:",
          ]
          lines.extend(f"- `{path.name}` ({path.parent.name.removeprefix('beacon-')})" for path in packages)
          Path("release-notes.md").write_text("\n\n".join(lines) + "\n", encoding="utf-8")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.name }}
          body_path: release-notes.md
          # Upload everything to a draft before making it visible to users.
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: "false"
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: true

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_LATEST: ${{ needs.prepare.outputs.make_latest }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --draft=false --latest="$RELEASE_LATEST"
