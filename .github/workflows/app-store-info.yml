name: App Store application information

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    steps:
      - name: Find Beacon application records
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          auth = ["--username", os.environ["APPLE_ID"], "--app-password", "@env:APPLE_PASSWORD"]
          def query(*arguments):
              result = subprocess.run(["xcrun", "altool", *arguments, *auth, "--output-format", "json"], capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)
          def walk(value, parent_id=None, path=""):
              if isinstance(value, dict):
                  yield value, parent_id, path
                  for key, child in value.items():
                      yield from walk(child, value.get("id", parent_id), path + "/" + key)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child, parent_id, path)
          providers = query("--list-providers")
          public_ids = set()
          uuid = re.compile(r"[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}")
          for record, _, _ in walk(providers):
              for value in record.values():
                  if isinstance(value, str) and uuid.fullmatch(value):
                      public_ids.add(value)
          if not public_ids:
              keys = sorted({key for record, _, _ in walk(providers) for key in record})
              raise SystemExit("No provider public IDs found; response fields: " + ", ".join(keys))
          found = []
          for public_id in sorted(public_ids):
              try:
                  applications = query("--list-apps", "--provider-public-id", public_id)
              except RuntimeError as error:
                  print("Could not query provider " + public_id + ": " + str(error))
                  continue
              for record, parent_id, path in walk(applications):
                  if any(isinstance(value, str) and "beacon" in value.casefold() for value in record.values()):
                      scalars = {key: value for key, value in record.items() if not isinstance(value, (dict, list))}
                      found.append({"provider_public_id": public_id, "parent_id": parent_id, "path": path, "application": scalars})
          print(json.dumps({"beacon_applications": found}, ensure_ascii=False, indent=2))
          if not found:
              raise SystemExit("No Beacon application was found for the configured Apple account.")
          PY
