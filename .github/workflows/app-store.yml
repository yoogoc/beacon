name: App Store Connect

on:
  workflow_dispatch:
    inputs:
      version:
        description: Formal version to validate (defaults to the workspace version); does not upload
        required: false
        default: ""
        type: string
      binary_run_id:
        description: Optional successful architecture artifacts to reuse from a main-branch run with identical Rust sources
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: app-store-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: xcode-27
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CARGO_TERM_COLOR: always
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_APP_IDENTITY: ${{ vars.APP_STORE_APP_IDENTITY }}
      APP_STORE_INSTALLER_IDENTITY: ${{ vars.APP_STORE_INSTALLER_IDENTITY }}
      APP_STORE_BUNDLE_ID: ${{ vars.APP_STORE_BUNDLE_ID }}
      APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/macos-sdk
        id: macos-sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate App Store configuration
        env:
          APP_STORE_CERTIFICATE: ${{ secrets.APP_STORE_CERTIFICATE }}
          APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          python scripts/app-store.py preflight
          python - <<'PY'
          import os
          required = ("APP_STORE_CERTIFICATE", "APP_STORE_CERTIFICATE_PASSWORD", "APPLE_ID", "APPLE_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Secrets: " + ", ".join(missing))
          PY
      - name: Validate App Store Connect authentication
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: xcrun altool --list-providers --username "$APPLE_ID" --app-password '@env:APPLE_PASSWORD' > /dev/null
      - name: Apply release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        # Encode the attempt too, so an upload rerun never reuses a build number.
        run: |
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          export GITHUB_RUN_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          fi
          python scripts/release.py set "$RELEASE_VERSION"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify reused binary provenance
        if: github.event_name == 'workflow_dispatch' && inputs.binary_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BINARY_RUN_ID: ${{ inputs.binary_run_id }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, tomllib
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["BINARY_RUN_ID"]
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit("binary_run_id must be numeric")
          run = json.loads(command("gh", "api", f"repos/{repository}/actions/runs/{run_id}"))
          if run["head_repository"]["full_name"] != repository or run["head_branch"] != "main" or run["path"].split("@")[0] != ".github/workflows/app-store.yml":
              raise SystemExit("Only this repository's main-branch App Store artifacts can be reused")
          jobs = json.loads(command("gh", "api", f"repos/{repository}/actions/runs/{run_id}/jobs"))["jobs"]
          expected = {"app-store (aarch64-apple-darwin)", "app-store (x86_64-apple-darwin)"}
          if not expected.issubset({job["name"] for job in jobs if job["conclusion"] == "success"}):
              raise SystemExit("Both architecture builds must have succeeded")
          source = run["head_sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", source):
              raise SystemExit("Invalid source commit")
          if subprocess.run(["git", "cat-file", "-e", source + "^{commit}"], capture_output=True).returncode:
              subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", source], check=True)
          for path in ("Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates", "vendor", "assets", ".cargo", ".github/actions/macos-sdk"):
              if command("git", "rev-parse", f"{source}:{path}") != command("git", "rev-parse", f"HEAD:{path}"):
                  raise SystemExit("Reused binaries do not match current compilation inputs: " + path)
          version = tomllib.loads(command("git", "show", source + ":Cargo.toml"))["workspace"]["package"]["version"]
          if version != os.environ["RELEASE_VERSION"]:
              raise SystemExit("Reused binary version does not match requested package version")
          print("Verified both architecture artifacts from source commit " + source)
          PY

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.binary_run_id == ''
    needs: prepare
    name: app-store (${{ matrix.target }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/macos-sdk
        id: macos-sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          export GITHUB_RUN_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          python scripts/release.py set "$RELEASE_VERSION"
      # Keep the installed toolchain name identical to rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - name: Install cross-compilation target
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          for attempt in 1 2 3; do
            if rustup target add --toolchain 1.98 "$RUST_TARGET"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "::warning::Rust target download failed; retrying in 15 seconds (attempt $attempt of 3)."
            sleep 15
          done
      - name: Verify active Rust target
        run: rustup target list --installed | grep -Fx '${{ matrix.target }}'
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-store-${{ matrix.target }}${{ steps.macos-sdk.outputs.cache-suffix }}
          cache-on-failure: true
      - name: Build sandboxed application
        run: cargo build --locked --release -p beacon --features app-store --target ${{ matrix.target }}
      - name: Verify macOS SDK and deployment target
        run: python scripts/check-macos-sdk.py target/${{ matrix.target }}/release/beacon --sdk-version "$BEACON_MACOS_SDK_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/beacon
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.binary_run_id != '')) }}
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_APP_IDENTITY: ${{ vars.APP_STORE_APP_IDENTITY }}
      APP_STORE_INSTALLER_IDENTITY: ${{ vars.APP_STORE_INSTALLER_IDENTITY }}
      APP_STORE_BUNDLE_ID: ${{ vars.APP_STORE_BUNDLE_ID }}
      APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/macos-sdk
        id: macos-sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          export GITHUB_RUN_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          python scripts/release.py set "$RELEASE_VERSION"
      - name: Set temporary keychain path
        run: echo "APP_STORE_KEYCHAIN=$RUNNER_TEMP/beacon-app-store.keychain-db" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-store-tools${{ steps.macos-sdk.outputs.cache-suffix }}
          cache-on-failure: true
      - name: Install cargo-packager
        run: |
          if ! cargo packager --version 2>/dev/null | grep -q '0.11.8'; then
            cargo install cargo-packager --version 0.11.8 --locked --force
          fi
      - uses: actions/download-artifact@v4
        with:
          name: app-store-binary-aarch64-apple-darwin
          path: target/app-store/arm64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.binary_run_id || github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: app-store-binary-x86_64-apple-darwin
          path: target/app-store/amd64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.binary_run_id || github.run_id }}
      - name: Combine universal executable
        run: |
          lipo -create target/app-store/arm64/beacon target/app-store/amd64/beacon -output target/app-store/beacon
          chmod +x target/app-store/beacon
      - name: Import App Store signing identities
        env:
          APP_STORE_CERTIFICATE: ${{ secrets.APP_STORE_CERTIFICATE }}
          APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATE_PASSWORD }}
          APP_STORE_PROVISIONING_PROFILE: ${{ secrets.APP_STORE_PROVISIONING_PROFILE }}
        run: |
          python - <<'PY'
          import base64, json, os, secrets, shlex, subprocess
          from pathlib import Path
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)
          directory = Path(os.environ["RUNNER_TEMP"])
          previous = shlex.split(run("security", "list-keychains", "-d", "user", capture_output=True, text=True).stdout)
          (directory / "beacon-keychains.json").write_text(json.dumps(previous))
          password = secrets.token_urlsafe(32)
          print("::add-mask::" + password)
          keychain = os.environ["APP_STORE_KEYCHAIN"]
          certificate = directory / "beacon-app-store.p12"
          certificate.write_bytes(base64.b64decode(os.environ["APP_STORE_CERTIFICATE"], validate=True))
          certificate.chmod(0o600)
          try:
              run("security", "create-keychain", "-p", password, keychain)
              run("security", "set-keychain-settings", "-lut", "21600", keychain)
              run("security", "unlock-keychain", "-p", password, keychain)
              run("security", "list-keychains", "-d", "user", "-s", keychain, *previous)
              run("security", "import", str(certificate), "-k", keychain, "-P", os.environ["APP_STORE_CERTIFICATE_PASSWORD"], "-T", "/usr/bin/codesign", "-T", "/usr/bin/productbuild", stdout=subprocess.DEVNULL)
              run("security", "set-key-partition-list", "-S", "apple-tool:,apple:,codesign:", "-s", "-k", password, keychain, stdout=subprocess.DEVNULL)
              identities = run("security", "find-identity", "-v", keychain, capture_output=True, text=True).stdout
              for name in ("APP_STORE_APP_IDENTITY", "APP_STORE_INSTALLER_IDENTITY"):
                  if '"' + os.environ[name] + '"' not in identities:
                      raise SystemExit(name + " is missing from the imported p12")
          finally:
              certificate.unlink(missing_ok=True)
          profile = os.environ.get("APP_STORE_PROVISIONING_PROFILE")
          if profile:
              (directory / "beacon-app-store.provisionprofile").write_bytes(base64.b64decode(profile, validate=True))
          PY
      - name: Sign application and installer
        run: |
          PROFILE_ARGS=()
          if [ -f "$RUNNER_TEMP/beacon-app-store.provisionprofile" ]; then
            PROFILE_ARGS=(--profile "$RUNNER_TEMP/beacon-app-store.provisionprofile")
          fi
          python scripts/app-store.py package --keychain "$APP_STORE_KEYCHAIN" "${PROFILE_ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-${{ needs.prepare.outputs.version }}
          path: target/app-store/*.pkg
          if-no-files-found: error
      - name: Validate package with App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APP_STORE_PROVIDER_ID: ${{ vars.APP_STORE_PROVIDER_ID }}
        run: |
          PROVIDER_ARGS=()
          if [ -n "$APP_STORE_PROVIDER_ID" ]; then
            PROVIDER_ARGS=(--provider-public-id "$APP_STORE_PROVIDER_ID")
          fi
          if [ -n "$APP_STORE_APP_ID" ]; then
            PROVIDER_ARGS+=(--apple-id "$APP_STORE_APP_ID")
          fi
          xcrun altool --validate-app target/app-store/*.pkg --username "$APPLE_ID" --app-password '@env:APPLE_PASSWORD' "${PROVIDER_ARGS[@]}"
      - name: Upload to App Store Connect and wait for processing
        if: github.event_name == 'push'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APP_STORE_PROVIDER_ID: ${{ vars.APP_STORE_PROVIDER_ID }}
        run: |
          PROVIDER_ARGS=()
          if [ -n "$APP_STORE_PROVIDER_ID" ]; then
            PROVIDER_ARGS=(--provider-public-id "$APP_STORE_PROVIDER_ID")
          fi
          if [ -n "$APP_STORE_APP_ID" ]; then
            PROVIDER_ARGS+=(--apple-id "$APP_STORE_APP_ID")
          fi
          xcrun altool --upload-package target/app-store/*.pkg --username "$APPLE_ID" --app-password '@env:APPLE_PASSWORD' --wait "${PROVIDER_ARGS[@]}"
      - name: Record validation result
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "Validated the signed universal package for Beacon $RELEASE_VERSION with App Store Connect. No build was uploaded." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing material
        if: always()
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"])
          previous = directory / "beacon-keychains.json"
          if previous.exists():
              subprocess.run(["security", "list-keychains", "-d", "user", "-s", *json.loads(previous.read_text())], check=True)
              previous.unlink()
          keychain = directory / "beacon-app-store.keychain-db"
          if keychain.exists():
              subprocess.run(["security", "delete-keychain", str(keychain)], check=True)
          for name in ("beacon-app-store.p12", "beacon-app-store.provisionprofile"):
              (directory / name).unlink(missing_ok=True)
          PY
