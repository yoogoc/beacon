name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to test for the calling release workflow
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Formatting and lints run once. They are platform independent, and finding
  # out about them three times is not three times as useful.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release.py set "$RELEASE_VERSION"
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets

      # The packaging config names its icons by relative path. Without this a
      # rename would build and test perfectly and then fail in the release
      # workflow, on main, after the commit that broke it.
      - name: Packaging assets and version metadata
        run: |
          python3 - <<'EOF'
          import pathlib, sys, tomllib

          manifest = pathlib.Path("crates/beacon/Cargo.toml")
          packager = tomllib.loads(manifest.read_text())["package"]["metadata"]["packager"]
          missing = [i for i in packager["icons"] if not (manifest.parent / i).exists()]
          info_path = manifest.parent / packager["macos"]["info-plist-path"]
          if not info_path.exists():
              missing.append(str(info_path))
          for icon in missing:
              print(f"missing icon: {icon}", file=sys.stderr)
          sys.exit(1 if missing else 0)
          EOF

      - name: macOS bundle version matches workspace
        run: |
          python3 - <<'EOF'
          import pathlib, plistlib, tomllib

          root = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          version = root["workspace"]["package"]["version"]
          info = plistlib.loads(pathlib.Path("assets/packaging/Info.plist").read_bytes())
          if info["BeaconVersion"] != version or info["CFBundleShortVersionString"] != version.split("-")[0]:
              raise SystemExit("Run python3 scripts/release.py set with the workspace version to synchronize packaging metadata")
          EOF

  # The point of this matrix is to find platform breakage on the day it lands
  # rather than at the end of a milestone. GPUI's platform layers differ enough
  # (Metal / Vulkan / DirectX, and three separate windowing stacks) that
  # "it compiles on macOS" says very little about the other two.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply release version
        if: inputs.version != ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release.py set "$RELEASE_VERSION"

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --locked --workspace --all-targets

      # beacon-kube and beacon-columns are headless by construction, so the
      # whole test suite runs on a CI runner without a display.
      - name: Test
        run: cargo test --locked --workspace
