<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Beacon navigator mascot</title>
  <!-- Approved mascot artwork; retain the raster source for future refinements. -->
  <defs>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="white"/>
    <image width="1024" height="1024" href="concepts/beacon-mascot-compact-v1.png"/>
  </g>
</svg>
