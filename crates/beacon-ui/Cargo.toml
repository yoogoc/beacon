[package]
name = "beacon-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
app-store = ["beacon-updater/app-store", "dep:objc2", "dep:objc2-foundation"]
ui-tests = ["gpui-kit/test-support", "beacon-kube/test-support"]

[dependencies]
alacritty_terminal.workspace = true
beacon-columns.workspace = true
beacon-kube.workspace = true
beacon-updater.workspace = true
gpui-kit.workspace = true
nucleo-matcher.workspace = true
anyhow.workspace = true
futures.workspace = true
serde_json.workspace = true
serde.workspace = true
directories.workspace = true
tempfile.workspace = true
serde-saphyr.workspace = true
similar = "2.7"
regex = "1"
lsp-types = "0.97"
tree-sitter = "0.26"
tree-sitter-yaml = "0.7"
tokio.workspace = true
tracing.workspace = true
base64.workspace = true
sha2.workspace = true
x509-parser = "0.18.1"
url.workspace = true
rust-i18n = "4.2.2"
sys-locale = "0.3.2"
roxmltree = "=0.21.1"

[build-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"], optional = true }
