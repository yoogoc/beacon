# Ship Windows executables without requiring the VC++ Redistributable.
# RUSTFLAGS overrides these entries; CI must preserve +crt-static explicitly.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
